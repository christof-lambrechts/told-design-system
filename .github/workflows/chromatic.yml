# Publie le Storybook sur Chromatic à chaque envoi sur GitHub.
# Actif quand la variable CHROMATIC_ENABLED vaut true (Settings > Secrets and variables > Actions), avec le secret CHROMATIC_PROJECT_TOKEN.
name: Storybook (Chromatic)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  chromatic:
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true
